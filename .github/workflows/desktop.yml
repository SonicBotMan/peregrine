name: desktop

# M3-c2: Tauri shell build. The dev container lacks webkit2gtk, so
# the src-tauri crate is NOT a workspace member and never builds
# locally — this workflow is the ONLY place the desktop bundle is
# compiled and validated.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      - name: Build daemon sidecar (release)
        run: cargo build -p peregrine-server --release

      - name: Stage sidecar binary for tauri externalBin
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/peregrined \
            "apps/desktop/src-tauri/binaries/peregrined-$TRIPLE"

      - name: Build desktop bundle (deb + appimage)
        run: pnpm exec tauri build --bundles deb,appimage
        working-directory: apps/desktop

      - name: Frontend type-check + unit tests (R2 P2-d1)
        # svelte-check was never wired into any gate: two real type
        # errors (plugin-notification 1.x `send`, TaskView imported
        # from the wrong module) sat invisible because vite build
        # skips type-checking. Both are fixed; keep the gate.
        run: |
          pnpm exec svelte-check --tsconfig ./tsconfig.app.json
          pnpm test
        working-directory: apps/desktop

      - name: Verify deb dependency closure (B42)
        # The deb installs on a clean box only if every webkit
        # runtime lib lands in Depends. Print the control fields so
        # a missing dependency is visible in the run log (and fails
        # the step if dpkg-deb itself errors).
        run: |
          shopt -s globstar
          found=0
          for deb in apps/desktop/src-tauri/target/release/bundle/**/*.deb; do
            [ -e "$deb" ] || continue
            found=1
            echo "=== $deb ==="
            dpkg-deb -I "$deb"
            if ! dpkg-deb -f "$deb" Depends | grep -qi 'webkit2gtk'; then
              echo "::error::webkit2gtk missing from $deb Depends — the deb will not run on a clean install"
              exit 1
            fi
          done
          [ "$found" = 1 ] || { echo "::error::no .deb produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peregrine-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/peregrine-desktop
            apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
