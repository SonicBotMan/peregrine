name: Feature request
description: Suggest an idea for Peregrine
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / pain point
      description: What are you trying to do, and what gets in the way? Lead with the job, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you change, concretely?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you weighed
  - type: checkboxes
    id: fit
    attributes:
      label: Architecture fit
      description: Peregrine is a headless daemon with thin clients (CLI / GUI / MCP). Ideas that keep that separation are easiest to accept.
      options:
        - label: This fits the daemon-as-core, thin-client architecture
        - label: I checked the roadmap and this is not already listed
