[workspace]
resolver = "2"
members = ["crates/api", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SonicBotMan/peregrine"
authors = ["SonicBotMan"]

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
# server stack
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cli
clap = { version = "4", features = ["derive"] }
# errors & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# unix primitives (real uid for socket paths). This environment's index no
# longer carries the 0.3 line; 1.0.0-alpha.4 keeps the stable getuid binding.
libc = "1.0.0-alpha.4"

# internal crates
peregrine-api = { path = "crates/api" }

[profile.release]
lto = "thin"
strip = true
