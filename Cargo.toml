[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/server",
    "crates/cli",
    "crates/engine-http",
    "crates/storage",
    "crates/task-manager",
    "crates/scheduler",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SonicBotMan/peregrine"
authors = ["SonicBotMan"]

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# url handling (parse/route/join redirects)
url = "2"
# https for engines (ring provider: pure-rust build, no system openssl)
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "native-tokio",
    "http1",
    "logging",
] }
# server stack
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cli
clap = { version = "4", features = ["derive"] }
# errors & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
peregrine-task-manager = { path = "crates/task-manager" }
peregrine-engine-http = { path = "crates/engine-http" }
# unix primitives (real uid for socket paths). This environment's index no
# longer carries the 0.3 line; 1.0.0-alpha.4 keeps the stable getuid binding.
libc = "1.0.0-alpha.4"

# internal crates
peregrine-api = { path = "crates/api" }
peregrine-storage = { path = "crates/storage" }
# sqlite (WAL): segment table for byte-exact resume (PROPOSAL §5.2)
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
