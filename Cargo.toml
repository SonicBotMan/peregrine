[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/server",
    "crates/cli",
    "crates/mcp",
    "crates/engine-http",
    "crates/storage",
    "crates/task-manager",
    "crates/scheduler",
    "crates/engine-hls",
    "crates/engine-ftp",
    "crates/engine-bt",
]

[workspace.package]
version = "2.0.0-alpha.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SonicBotMan/peregrine"
authors = ["SonicBotMan"]

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# url handling (parse/route/join redirects)
url = "2"
# proxy connector + native root store (already in the tree via
# hyper-rustls; pinned explicitly so the engine's own code can use them)
base64 = "0.22"
futures = "0.3"
rustls-native-certs = "0.8"
# https for engines (ring provider: pure-rust build, no system openssl)
librqbit = { version = "9", default-features = false, features = ["rust-tls", "http-api-client"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "native-tokio",
    "http1",
    "logging",
] }
# server stack
axum = { version = "0.8", features = ["ws"] }
hyper = "1"
bytes = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cli
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
# errors & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
peregrine-task-manager = { path = "crates/task-manager" }
peregrine-engine-http = { path = "crates/engine-http" }
peregrine-engine-hls = { path = "crates/engine-hls" }
peregrine-engine-bt = { path = "crates/engine-bt" }
peregrine-engine-ftp = { path = "crates/engine-ftp" }
# unix primitives (real uid for socket paths). This environment's index no
# longer carries the 0.3 line; 1.0.0-alpha.4 keeps the stable getuid binding.
libc = "1.0.0-alpha.4"

# internal crates
peregrine-api = { path = "crates/api" }
peregrine-scheduler = { path = "crates/scheduler" }
peregrine-server = { path = "crates/server" }
peregrine-storage = { path = "crates/storage" }
# sqlite (WAL): segment table for byte-exact resume (PROPOSAL §5.2)
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
