[package]
name = "peregrine-cli"
description = "pg — thin client for the peregrine daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "pg"
path = "src/main.rs"

[dependencies]
peregrine-api = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
peregrine-scheduler = { workspace = true }
peregrine-server = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }

# M6-a packaging: `cargo deb` builds a headless package with the full
# binary set — `pg` CLI + `peregrined` daemon + `peregrine-mcp` bridge.
# scripts/package.sh builds the whole workspace first, so all three
# exist in target/release/ (the shared workspace target dir).
# No system deps: pure-Rust TLS (rustls/ring), so `depends` stays
# empty ($auto would pull libc only).
[package.metadata.deb]
name = "peregrine"
maintainer = "SonicBotMan <SonicBotMan@users.noreply.github.com>"
copyright = "2026, SonicBotMan"
license-file = ["../../LICENSE", "0"]
extended-description-file = "README.md"
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/pg", "usr/bin/", "755"],
    ["target/release/peregrined", "usr/bin/", "755"],
    ["target/release/peregrine-mcp", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/peregrine/README.md", "644"],
]
